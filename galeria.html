<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería · Paw Spa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { primary: '#f59e0b', 'primary-dark': '#d97706', secondary: '#3b82f6', accent: '#10b981' } } }
    }
  </script>
</head>
<body class="bg-white text-gray-800">

  <div id="navbar-mount"></div>

  <!-- Hero galería -->
  <section class="hero" style="min-height: 50vh; background-image: linear-gradient(135deg, rgba(245, 158, 11, 0.85), rgba(59, 130, 246, 0.7)), url('https://placedog.net/1920/1080?id=60');">
    <div class="container mx-auto px-6 hero-content text-white text-center">
      <span class="inline-block px-4 py-1 bg-white/20 backdrop-blur rounded-full text-sm font-medium mb-6 animate-bounce-in">Galería</span>
      <h1 class="text-5xl md:text-6xl font-extrabold mb-4">Nuestros <span class="text-amber-300">peludos</span> felices</h1>
      <p class="text-xl max-w-2xl mx-auto text-white/90">Mira las transformaciones y momentos de alegría en Paw Spa.</p>
    </div>
  </section>

  <!-- Filtros + grid -->
  <section class="section bg-white">
    <div class="container mx-auto px-6">
      <div class="flex flex-wrap justify-center gap-3 mb-12 animate-on-scroll">
        <button class="filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn" data-filter="corte">Corte</button>
        <button class="filter-btn" data-filter="banio">Baño</button>
        <button class="filter-btn" data-filter="spa">Spa</button>
        <button class="filter-btn" data-filter="antes-despues">Antes/Después</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 gallery-grid" id="gallery-mount"></div>
    </div>
  </section>

  <!-- Stats galería -->
  <section class="py-16 bg-gradient-to-r from-amber-500 to-blue-500 text-white">
    <div class="container mx-auto px-6 text-center">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
        <div class="animate-on-scroll">
          <div class="text-5xl font-extrabold mb-2">+1.250</div>
          <div class="text-sm">Transformaciones</div>
        </div>
        <div class="animate-on-scroll">
          <div class="text-5xl font-extrabold mb-2">98%</div>
          <div class="text-sm">Satisfacción</div>
        </div>
        <div class="animate-on-scroll">
          <div class="text-5xl font-extrabold mb-2">200+</div>
          <div class="text-sm">Razas atendidas</div>
        </div>
        <div class="animate-on-scroll">
          <div class="text-5xl font-extrabold mb-2">5⭐</div>
          <div class="text-sm">Valoración media</div>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section bg-white text-center">
    <div class="container mx-auto px-6 animate-on-scroll">
      <h2 class="text-4xl font-bold mb-4">¿Quieres ver a tu peludo aquí?</h2>
      <p class="text-xl text-gray-600 mb-6">Reserva tu cita y únete a nuestra galería de perros felices.</p>
      <a href="contacto.html" class="btn-primary">📅 Reservar cita</a>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = PARTIALS.NAVBAR('galeria');
    document.getElementById('footer-mount').innerHTML = PARTIALS.FOOTER();
  </script>
</body>
</html>
